  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#10243e}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}.container{width:min(1180px,calc(100% - 40px));margin:auto}.top{height:36px;background:#001e50;color:#dce8f5;padding:0 max(20px,calc((100% - 1180px)/2));display:flex;justify-content:flex-end;align-items:center;font-size:12px}.nav{height:80px;display:flex;align-items:center;justify-content:space-between}.logo{width:50px}.links{display:flex;gap:30px;align-items:center;font-size:14px}.links a:hover{color:#5279a8}.cta,.button{background:#001e50;color:#fff;padding:13px 19px;border:0;display:inline-block;font-weight:700}.hero{min-height:550px;background:#001e50;color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#001e50 10%,transparent 90%)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}.hero-content{position:relative;z-index:1;padding-top:130px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:#5279a8}.light{color:#a7c9eb}.hero h1,.detail h1{font-size:clamp(46px,7vw,82px);line-height:.98;letter-spacing:-4px;margin:20px 0}.hero em,.detail em{font-style:normal;color:#8db7e8}.hero p{max-width:420px;color:#d3e1ef;font-size:18px}.light-button{background:white;color:#001e50;margin-top:20px}.section{padding:85px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:35px}.section h2{font-size:clamp(32px,5vw,52px);line-height:1;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}    .card{border:1px solid #e1e8ef;background:#fff;cursor:pointer}.card:hover,.card:focus-visible{box-shadow:0 12px 30px #001e5018;transform:translateY(-3px);outline:2px solid #5279a8;outline-offset:3px}.card img{width:100%;height:210px;object-fit:contain;background:#f3f6f9}.card-body{padding:20px}.card h3{font-size:28px;margin:7px 0}.card p{color:#     .price-list{padding:80px 0}.price-list h1,.contact-page h1{font-size:clamp(44px,7vw,78px);line-height:1;letter-spacing:-3px;margin:16px 0}.price-row{display:grid;grid-template-columns:1fr 1fr auto;gap:20px;align-items:center;padding:22px 8px;border-bottom:1px solid #dfe6ed;border-top:1px solid #dfe6ed}.price-row span{display:block;color:#718197;font-size:13px}.price-row a{color:#001e50;font-weight:700;font-size:13px}.contact-page{padding:80px 0}.contact-box{max-width:620px;background:#f3f6f9;padding:30px;display:grid;gap:16px}.contact-box label{display:grid;gap:7px;font-size:13px;font-weight:700}.contact-box input,.contact-box textarea{border:1px solid #ccd8e4;padding:12px;background:#fff}.contact-box button{width:max-content;cursor:pointer}@media(max-width:700px){.price-row{grid-template-columns:1fr auto}.price-row a{grid-column:1/-1}}
    @media(max-width:700px){.technical-grid{grid-template-columns:repeat(2,1fr)}}

  <header class="nav container"><a href="index.html" aria-label="Volkswagen ana sayfa"><img class="logo" src="public/img/vwlogo.png" alt="Volkswagen"></a><nav class="links" aria-label="Ana menü"><a href="#modeller">Modeller</a><a href="#fiyatlar">Fiyat Listesi</a><a class="cta" href="#iletisim">Bize ulaşın</a></nav></header>
  <div id="app"></div>
  <footer class="footer"><div class="container">© 2026 Volkswagen Türkiye &nbsp; • &nbsp; Kalite. Güven. Teknoloji.</div></footer>
  <script>
    const models=[
      ['Golf','Hatchback','golf.png','1.745.000 TL','150 PS','5,6 l/100 km','Sürüş keyfinin ikonik hali.','1.5 eTSI mild hybrid','7 ileri DSG','8,5 sn','381 L','IQ.LIGHT LED farlar, Travel Assist',[['Life','Günlük konfor ve bağlantı teknolojileri','+ 85.000 TL'],['Style','Panoramik cam tavan ve gelişmiş aydınlatma','+ 165.000 TL'],['R-Line','Sportif tasarım ve dinamik iç mekan','+ 225.000 TL']]],
      ['T-Roc','SUV','troc.png','1.980.000 TL','150 PS','6,2 l/100 km','Şehrin ritmine ayak uydurur.','1.5 TSI turbo benzinli','7 ileri DSG','8,6 sn','445 L','Adaptif hız sabitleyici, Park Assist',[['Life','Park Assist ve adaptif hız sabitleyici','+ 95.000 TL'],['Style','Matrix LED farlar ve konfor paketi','+ 185.000 TL'],['R-Line','R-Line dış tasarım ve spor koltuklar','+ 245.000 TL']]],
      ['Tiguan','SUV','tiguan.png','2.485.000 TL','204 PS','6,5 l/100 km','Her maceraya hazır.','1.5 eTSI plug-in hybrid','6 ileri DSG','8,2 sn','652 L','Panoramik cam tavan, Area View',[['Elegance','Panoramik cam tavan ve elektrikli bagaj','+ 190.000 TL'],['R-Line','Sportif gövde paketi ve spor direksiyon','+ 260.000 TL'],['Black Style','Siyah dış tasarım detayları','+ 310.000 TL']]],
      ['Polo','Hatchback','polo.png','1.290.000 TL','95 PS','5,2 l/100 km','Kompakt, enerjik, özgür.','1.0 TSI turbo benzinli','7 ileri DSG','10,8 sn','351 L','Digital Cockpit, LED farlar',[['Life','Digital Cockpit ve LED farlar','+ 70.000 TL'],['Style','Konfor ve sürüş destek paketi','+ 125.000 TL'],['R-Line','Sportif dış görünüm paketi','+ 175.000 TL']]],
      ['Passat','Station Wagon','passat.png','2.690.000 TL','150 PS','5,7 l/100 km','Uzun yolların yeni standardı.','1.5 eTSI mild hybrid','7 ileri DSG','9,3 sn','690 L','Ergonomik koltuklar, Travel Assist',[['Business','Travel Assist ve ergonomik ön koltuklar','+ 180.000 TL'],['Elegance','Panoramik cam tavan ve premium ses','+ 290.000 TL'],['R-Line','R-Line tasarım ve spor süspansiyon','+ 340.000 TL']]],
      ['Touareg','Premium SUV','touareg.png','4.850.000 TL','340 PS','8,4 l/100 km','Premium deneyimin güçlü yorumu.','3.0 V6 TSI','8 ileri Tiptronic','5,9 sn','810 L','Havalı süspansiyon, IQ.LIGHT HD',[['Elegance','Havalı süspansiyon ve deri konfor koltuklar','+ 320.000 TL'],['R-Line','R-Line dış tasarım ve 21 inç jantlar','+ 460.000 TL'],['Black Edition','Özel siyah tasarım ve premium ses sistemi','+ 620.000 TL']]]
    ];
    try{const savedCatalog=JSON.parse(localStorage.getItem('vw-model-packages')||'{}');models.forEach((model)=>{if(savedCatalog[model[0]])model[12]=savedCatalog[model[0]]})}catch{}
    const base=location.protocol==='file:'?'public/img/':'img/';
    const image=(name)=>base+name;
    const slug=(name)=>name.toLowerCase().replace(' ','-');
    const card=(m)=>`<article class="card" role="link" tabindex="0" aria-label="Volkswagen ${m[0]} model detaylarını aç" onclick="location.hash='model/${slug(m[0])}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='model/${slug(m[0])}'}"><img src="${image(m[2])}" alt="Volkswagen ${m[0]}"><div class="card-body"><span class="eyebrow">${m[1]}</span><h3>${m[0]}</h3><p>Başlangıç fiyatı <strong>${m[3]}</strong></p><a class="card-link" href="#model/${slug(m[0])}">Modeli keşfet →</a></div></article>`;
    function render(){
      const key=location.hash.slice(1), selected=models.find(m=>slug(m[0])===key.replace('model/',''));
      if(location.pathname!=='/admin' && key!=='admin') document.querySelector('.links').style.display='';
      if(key==='admin' || location.pathname==='/admin'){document.title='Yönetim Paneli | Volkswagen';document.querySelector('.links').style.display='none';document.getElementById('app').innerHTML=`<main class="admin-login container"><span class="eyebrow">Güvenli yönetim</span><h1>Admin paneli<br><em>girişi.</em></h1><form id="admin-login-form" class="login-box"><label>Kullanıcı adı<input required name="username" autocomplete="username"></label><label>Şifre<input required type="password" name="password" autocomplete="current-password"></label><button class="button" type="submit">Giriş yap →</button><span id="login-error" class="error" role="alert"></span></form></main>`;document.getElementById('admin-login-form').addEventListener('submit',loginAdmin);return}
      if(key==='fiyatlar'){document.title='Volkswagen Fiyat Listesi | Güncel Fiyatlar';document.getElementById('app').innerHTML=`<main class="price-list container"><span class="eyebrow">Güncel fiyatlar</span><h1>Volkswagen fiyat<br><em>listesi.</em></h1><p class="lead">Tavsiye edilen anahtar teslim başlangıç fiyatları.</p><section class="price-table">${models.map(m=>`<div class="price-row"><div><strong>${m[0]}</strong><span>${m[1]}</span></div><strong>${m[3]}</strong><a href="#model/${slug(m[0])}">Modeli incele →</a></div>`).join('')}</section></main>`;return}
      if(key==='iletisim'){document.title='İletişim ve Teklif | Volkswagen';document.getElementById('app').innerHTML=`<main class="contact-page container"><span class="eyebrow">İletişim ve teklif</span><h1>Sizin için<br><em>buradayız.</em></h1><p class="lead">Sorularınızı veya fiyat teklifi talebinizi bize iletin.</p><form class="login-box" onsubmit="sendMessage(event)"><label>Ad soyad<input required name="name" autocomplete="name"></label><label>E-posta<input required type="email" name="email" autocomplete="email"></label><label>Mesajınız<textarea required name="message" rows="5"></textarea></label><button class="button" type="submit">Gönder →</button><span id="contact-status"></span></form></main>`;return}
      if(selected){document.title=`Volkswagen ${selected[0]} | Özellikler ve Fiyat`;document.getElementById('app').innerHTML=`<main class="detail"><div class="detail-inner container"><div><a class="back" href="#modeller">← Tüm modeller</a><span class="eyebrow light">${selected[1]}</span><h1>Volkswagen<br><em>${selected[0]}</em></h1><p>${selected[6]}</p><a class="button light-button" href="#iletisim">Teklif alın →</a></div><img src="${image(selected[2])}" alt="Volkswagen ${selected[0]} dış görünüm"></div></main><section class="detail-content container"><span class="eyebrow">Sizin için tasarlandı</span><h2>${selected[0]} ile tanışın</h2><p>${selected[6]} Volkswagen kalitesi, ileri teknoloji ve konforla her yolculuğu daha özel kılar.</p><h3 class="technical-title">Teknik özellikler</h3><div class="technical-grid"><div><span>Motor</span><b>${selected[7]}</b></div><div><span>Şanzıman</span><b>${selected[8]}</b></div><div><span>Maksimum güç</span><b>${selected[4]}</b></div><div><span>0–100 km/sa</span><b>${selected[9]}</b></div><div><span>Ortalama tüketim</span><b>${selected[5]}</b></div><div><span>Bagaj hacmi</span><b>${selected[10]}</b></div><div><span>Koltuk kapasitesi</span><b>5 kişi</b></div><div><span>Öne çıkan teknoloji</span><b>${selected[11]}</b></div></div><div class="packages"><h3>Donanım paketleri</h3><div class="package-grid">${selected[12].map(p=>`<article class="package-card"><h4>${p[0]}</h4><p>${p[1]}</p><strong>${p[2]}</strong></article>`).join('')}</div></div><a class="button" href="#iletisim">Test sürüşü talep edin →</a></section>`;return}
      if(key==='fiyatlar'){document.title='Volkswagen Fiyat Listesi | Güncel Fiyatlar';document.getElementById('app').innerHTML=`<main class="price-list container"><span class="eyebrow">Güncel fiyatlar</span><h1>Volkswagen fiyat<br><em>listesi.</em></h1><p class="lead">Tavsiye edilen anahtar teslim başlangıç fiyatları. Güncel kampanyalar ve donanım seçenekleri için teklif alın.</p><div class="price-table">${models.map(m=>`<div class="price-row"><div><strong>${m[0]}</strong><span>${m[1]}</span></div><strong>${m[3]}</strong><a href="#model/${slug(m[0])}">Modeli incele →</a></div>`).join('')}</div></main>`;return}
      if(key==='iletisim'){document.title='İletişim ve Teklif | Volkswagen';document.getElementById('app').innerHTML=`<main class="contact-page container"><span class="eyebrow">İletişim ve destek</span><h1>Hayalinizdeki araç<br><em>bir adım uzakta.</em></h1><p class="lead">Test sürüşü, fiyat teklifi veya model detayları için formu doldurun. Ekibimiz en kısa sürede size ulaşsın.</p><form class="contact-box" onsubmit="event.preventDefault();this.innerHTML='<strong>Talebiniz alındı.</strong><span>En kısa sürede sizinle iletişime geçeceğiz.</span>'"><label>Ad soyad<input required autocomplete="name"></label><label>E-posta<input required type="email" autocomplete="email"></label><label>Mesajınız<textarea required rows="4"></textarea></label><button class="button" type="submit">Gönder →</button></form></main>`;return}
      document.title='Volkswagen Türkiye | Yeni Nesil Sürüş';
      document.getElementById('app').innerHTML=`<main><section class="hero"><img src="${image('1.jpg')}" alt="Volkswagen otomobil yolda"><div class="hero-content container"><span class="eyebrow light">Yeni nesil mobilite</span><h1>Yolculuğunuzun<br><em>en güzel hali.</em></h1><p>Hayatın her anına eşlik eden Volkswagen modellerini keşfedin.</p><a class="button light-button" href="#modeller">Modelleri incele →</a></div></section><section id="modeller" class="section container"><div class="section-head"><div><span class="eyebrow">Volkswagen dünyası</span><h2>Size uygun modeli bulun</h2></div><a href="#modeller">Tüm modeller →</a></div><div class="grid">${models.map(card).join('')}</div></section></main>`;
    }
    function saveAdminPrices(){
      document.querySelectorAll('[data-price]').forEach((input)=>{models[input.dataset.price][3]=input.value});
      document.querySelectorAll('[data-package]').forEach((input)=>{const [modelIndex,packageIndex]=input.dataset.package.split('-').map(Number);models[modelIndex][12][packageIndex][2]=input.value});
      localStorage.setItem('vw-model-prices',JSON.stringify(models.map((m)=>[m[0],m[3]])));
      localStorage.setItem('vw-model-packages',JSON.stringify(Object.fromEntries(models.map((m)=>[m[0],m[12]]))));
      document.getElementById('admin-status').textContent='Değişiklikler kaydedildi.';
    }
    async function loginAdmin(event){event.preventDefault();const form=event.currentTarget;const error=document.getElementById('login-error');const button=form.querySelector('button');button.disabled=true;button.textContent='Kontrol ediliyor...';error.textContent='';try{const body=Object.fromEntries(new FormData(form));const response=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok){error.textContent=data.error||'Giriş başarısız.';return}renderAdminDashboard()}catch{error.innerHTML='Sunucu bağlantısı kurulamadı. Proje klasöründeki <strong>start-server.bat</strong> dosyasını çalıştırın veya <a href="http://localhost:3000/admin">sunucudaki admin panelini açın.</a>'}finally{button.disabled=false;button.textContent='Giriş yap →'}}
    let adminMessagesPromise=null;let adminTrashPromise=null;
    function preloadAdminData(){adminMessagesPromise=fetch('/api/admin/messages');adminTrashPromise=fetch('/api/admin/trash')}
    async function renderAdminDashboard(){document.getElementById('app').innerHTML=`<main class="admin-dashboard container"><span class="eyebrow">Yönetim paneli</span><h1>Kontrol<br><em>merkezi.</em></h1><div class="admin-tabs"><button onclick="renderAdminPrices()">Fiyatlar</button><button onclick="renderAdminMessages()">Gelen mesajlar</button><button onclick="renderAdminTrash()">Çöp kutusu</button><button onclick="logoutAdmin()">Çıkış</button></div><div id="admin-content"></div></main>`;preloadAdminData();renderAdminPrices()}
    let adminPriceModel=0;
    function renderAdminPrices(modelIndex=adminPriceModel){adminPriceModel=modelIndex;const model=models[modelIndex];document.getElementById('admin-content').innerHTML=`<div class="model-price-tabs">${models.map((m,i)=>`<button class="${i===modelIndex?'active':''}" type="button" onclick="renderAdminPrices(${i})">${m[0]}</button>`).join('')}</div><section class="package-editor"><div class="package-editor-heading"><div><span class="eyebrow">${model[1]}</span><h2>${model[0]} fiyatları</h2></div><label>Başlangıç fiyatı<input value="${model[3]}" data-price="${modelIndex}"></label></div><div class="package-grid">${model[12].map((pack,i)=>`<label class="package-price"><strong>${pack[0]}</strong><span>${pack[1]}</span><input value="${pack[2]}" data-package="${modelIndex}-${i}"></label>`).join('')}</div><button class="button" type="button" onclick="saveAdminPrices()">Değişiklikleri kaydet</button><p id="admin-status"></p></section>`}
    let adminSelectedEmail='';
    async function renderAdminMessages(selectedEmail){adminSelectedEmail=selectedEmail||adminSelectedEmail;const response=await (adminMessagesPromise||fetch('/api/admin/messages'));adminMessagesPromise=null;if(response.status===401){render();return}const data=await response.json();const conversations=[...new Map(data.messages.map((m)=>[m.email,m])).values()];conversations.sort((a,b)=>Math.max(...(data.replies||[]).filter((r)=>r.email===b.email).map((r)=>new Date(r.createdAt).getTime()),new Date(b.createdAt).getTime())-Math.max(...(data.replies||[]).filter((r)=>r.email===a.email).map((r)=>new Date(r.createdAt).getTime()),new Date(a.createdAt).getTime()));    const email=selectedEmail||conversations[0]?.email;adminSelectedEmail=email||'';if(email){await fetch('/api/admin/messages/read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})});data.messages=data.messages.map((m)=>m.email===email?({...m,readAt:m.readAt||new Date().toISOString()}):m)}const active=conversations.find((m)=>m.email===email)||conversations[0];const incoming=data.messages.filter((m)=>m.email===active?.email).map((m)=>({...m,direction:'in'}));    const outgoing=(data.replies||[]).filter((m)=>m.email===active?.email).map((m)=>({...m,direction:m.direction||'out'}));document.getElementById('admin-content').innerHTML=`<section class="conversation-layout">${conversations.length?`<nav class="conversation-tabs">${conversations.map((m)=>`<button class="${m.email===active?.email?'active':''}" onclick="renderAdminMessages('${m.email}')"><strong>${m.name}</strong><span>${m.email}</span><small>${data.messages.some((item)=>item.email===m.email&&!item.readAt)?'Görüntülenmedi':'Görüntülendi'}</small></button>`).join('')}</nav><div class="conversation-panel"><h2>${active.name}</h2><span class="conversation-email">${active.email}</span><button class="button" type="button" onclick="deleteAdminConversation('${active.email}')">Mesajları sil</button><div class="conversation-history">${[...incoming,...outgoing].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).map((m)=>`<article class="conversation-message ${m.direction}"><span>${m.direction==='in'?'Gelen mesaj':'Gönderilen yanıt'} · ${new Date(m.createdAt).toLocaleString('tr-TR')}</span>${m.direction==='out'?`<strong>${m.subject}</strong>`:''}    <p>${m.direction==='in'?(m.message||m.text):m.text}</p></article>`).join('')}</div><form class="reply-box" onsubmit="sendReply(event,'${active.email}','${active.id}')"><input required name="subject" value="Volkswagen talebiniz hakkında"><textarea required name="text" rows="3" placeholder="Yanıtınızı yazın"></textarea><button class="button" type="submit">E-posta ile yanıtla →</button><span class="reply-status"></span></form></div>`:'<p>Henüz gelen mesaj yok.</p>'}</section>`}
    async function deleteAdminConversation(email){await fetch('/api/admin/conversation/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})});renderAdminMessages()}
    async function renderAdminTrash(){const response=await (adminTrashPromise||fetch('/api/admin/trash'));adminTrashPromise=null;if(response.status===401){render();return}const data=await response.json();document.getElementById('admin-content').innerHTML=`<section class="message-list">${data.messages.length?data.messages.map((m)=>`<article class="message-item"><strong>${m.name} · ${m.email}</strong><p>${m.message}</p><small>15 gün içinde otomatik silinir.</small><button class="button" type="button" onclick="restoreAdminConversation('${m.email}')">Geri al</button></article>`).join(''):'<p>Çöp kutusu boş.</p>'}</section>`}
    async function restoreAdminConversation(email){await fetch('/api/admin/conversation/restore',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})});renderAdminTrash()}
    window.setInterval(()=>{if(location.hash==='#admin'&&document.querySelector('.conversation-layout'))renderAdminMessages(adminSelectedEmail)},5000);
    async function logoutAdmin(){await fetch('/api/auth/logout',{method:'POST'});location.hash='';location.pathname='/';render()}
    async function sendMessage(event){event.preventDefault();const form=event.target;const endpoint=(location.protocol==='file:'?'http://localhost:3000':'')+'/api/messages';try{const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const result=await response.json();if(!response.ok)throw new Error(result.error||'Mesaj gönderilemedi.');document.getElementById('contact-status').textContent='Mesajınız kaydedildi ve ekibimize iletildi.';form.reset()}catch(error){document.getElementById('contact-status').textContent=`Mesaj gönderilemedi: ${error.message}`}}
    async function sendReply(event,to,messageId){event.preventDefault();const form=event.currentTarget;const status=form.querySelector('.reply-status');const body=Object.fromEntries(new FormData(form));body.to=to;body.messageId=messageId;const response=await fetch('/api/admin/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await response.json();status.textContent=response.ok?'E-posta gönderildi.':(data.error||'E-posta gönderilemedi.');if(response.ok)renderAdminMessages(to)}
    try{const saved=JSON.parse(localStorage.getItem('vw-model-prices')||'[]');saved.forEach((item)=>{const model=models.find((m)=>m[0]===item[0]);if(model)model[3]=item[1]})}catch{}
    window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
